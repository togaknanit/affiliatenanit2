<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kadai Katuang - Showcase Affiliate</title>
  <!-- Google Fonts & Font Awesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #ee4d2d;
      --primary-hover: #d73211;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 14px;
      --shadow: 0 4px 20px -2px rgba(0,0,0,0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding-top: 130px; /* Jarak agar konten tidak tertutup banner sticky */
      padding-bottom: 40px;
    }

    /* Outer Wrapper for Desktop Device Feel */
    .app-container {
      width: 100%;
      max-width: 480px;
      padding: 0 16px;
      position: relative;
    }

    /* 1. STICKY FREEZE BANNER HEADER */
    .sticky-header {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 1000;
      border-bottom: 1px solid var(--border);
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
    }

    .banner-content {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--primary);
    }

    .brand-text h1 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.2;
    }

    .brand-text p {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: #f1f5f9;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    /* CATEGORY CHIPS BAR (HORIZONTAL SCROLL) */
    .category-scroll-bar {
      display: flex;
      gap: 8px;
      padding: 8px 16px 12px 16px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .category-scroll-bar::-webkit-scrollbar {
      display: none;
    }

    .chip {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      background: #f1f5f9;
      color: var(--text-muted);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
    }

    .chip.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 3px 10px rgba(238, 77, 45, 0.3);
    }

    /* 2. SIDE DRAWER MENU (CATEGORIES & SETTINGS) */
    .drawer-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1100;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
    }

    .drawer-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .drawer {
      position: fixed;
      top: 0; right: -280px;
      width: 280px;
      height: 100%;
      background: #fff;
      z-index: 1200;
      padding: 24px;
      box-shadow: -4px 0 20px rgba(0,0,0,0.1);
      transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
    }

    .drawer.open {
      right: 0;
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .drawer-title {
      font-weight: 700;
      font-size: 1.1rem;
    }

    .category-list-menu {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .category-item {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-main);
    }

    .category-item:hover, .category-item.active {
      background: #fff1ed;
      color: var(--primary);
    }

    /* 3. PRODUCT CARDS LIST */
    .product-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 10px;
    }

    .product-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      position: relative;
      transition: transform 0.2s ease;
      text-decoration: none;
      color: inherit;
    }

    .product-card:active {
      transform: scale(0.98);
    }

    .product-img {
      width: 76px;
      height: 76px;
      border-radius: 10px;
      object-fit: cover;
      background-color: #eee;
      flex-shrink: 0;
    }

    .product-details {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .product-title {
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.35;
      color: var(--text-main);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-tag {
      font-size: 0.7rem;
      color: var(--primary);
      background: #fff1ed;
      padding: 2px 8px;
      border-radius: 12px;
      width: fit-content;
      font-weight: 600;
    }

    .btn-buy {
      background: var(--primary);
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    /* 4. ADMIN CONTROL BADGES & DASHBOARD MODAL */
    .admin-controls {
      display: none;
      gap: 4px;
      margin-left: auto;
    }

    .admin-mode .admin-controls {
      display: flex;
    }

    .admin-mode .btn-buy {
      display: none;
    }

    .btn-admin-action {
      background: #e2e8f0;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .btn-admin-action.delete { background: #fee2e2; color: #ef4444; }
    .btn-admin-action.edit { background: #e0f2fe; color: #0284c7; }

    /* Modal Form for Login & Admin Edit */
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal.open {
      display: flex;
    }

    .modal-card {
      background: #fff;
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      padding: 20px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.85rem;
    }

    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: #fff;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }

    .admin-banner-bar {
      background: #1e293b;
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      margin-bottom: 12px;
      display: none;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
    }

    .admin-mode .admin-banner-bar {
      display: flex;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- 1. STICKY FREEZE HEADER BANNER -->
    <header class="sticky-header">
      <div class="banner-content">
        <div class="brand-info">
          <img src="https://via.placeholder.com/100?text=KK" alt="Kadai Katuang" class="brand-avatar" id="brand-img">
          <div class="brand-text">
            <h1 id="brand-title">Kadai Katuang 29</h1>
            <p>Rekomendasi Shopee Pilihan Terbaik</p>
          </div>
        </div>
        <div class="header-actions">
          <button class="icon-btn" onclick="toggleDrawer()" title="Menu Kategori">
            <i class="fa-solid fa-bars"></i>
          </button>
        </div>
      </div>

      <!-- FILTER KATEGORI (CHIPS) -->
      <div class="category-scroll-bar" id="category-chips">
        <!-- Render via JS -->
      </div>
    </header>

    <!-- ADMIN ACTIVE NOTIFICATION BANNER -->
    <div class="admin-banner-bar">
      <span><i class="fa-solid fa-user-shield"></i> Mode Admin Aktif</span>
      <button onclick="openAddModal()" style="background:#ee4d2d; border:none; color:#fff; padding:4px 8px; border-radius:4px; font-weight:bold; cursor:pointer;">+ Produk</button>
      <button onclick="logoutAdmin()" style="background:#475569; border:none; color:#fff; padding:4px 8px; border-radius:4px; cursor:pointer;">Keluar</button>
    </div>

    <!-- 2. PRODUCT LIST SECTION -->
    <main class="product-list" id="product-container">
      <!-- Item Produk Di-render Menggunakan JavaScript -->
    </main>

    <!-- FOOTER LOGIN TRIGGER -->
    <footer style="text-align: center; margin-top: 30px; font-size: 0.75rem; color: var(--text-muted);">
      <p>© 2026 Kadai Katuang Affiliate Hub</p>
      <span onclick="openLoginModal()" style="cursor: pointer; text-decoration: underline; opacity: 0.5;">Admin Access</span>
    </footer>

  </div>

  <!-- DRAWER MENU (GARIS TIGA) -->
  <div class="drawer-overlay" id="drawer-overlay" onclick="toggleDrawer()"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-header">
      <span class="drawer-title">Pilih Kategori</span>
      <button class="icon-btn" onclick="toggleDrawer()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <ul class="category-list-menu" id="drawer-categories">
      <!-- Rendered via JS -->
    </ul>
  </aside>

  <!-- MODAL 1: LOGIN ADMIN -->
  <div class="modal" id="login-modal">
    <div class="modal-card">
      <h3 style="margin-bottom: 12px;">Login Dashboard Admin</h3>
      <div class="form-group">
        <label>Password Admin</label>
        <input type="password" id="admin-pass-input" class="form-control" placeholder="Masukkan password (Default: 123456)">
      </div>
      <button class="btn-submit" onclick="verifyLogin()">Masuk Admin</button>
      <button onclick="closeModal('login-modal')" style="width:100%; border:none; background:none; padding:10px; margin-top:6px; cursor:pointer; font-size:0.8rem; color:#64748b;">Batal</button>
    </div>
  </div>

  <!-- MODAL 2: TAMBAH / EDIT PRODUK -->
  <div class="modal" id="product-modal">
    <div class="modal-card">
      <h3 id="modal-title" style="margin-bottom: 12px;">Tambah Produk Baru</h3>
      <input type="hidden" id="edit-index">
      
      <div class="form-group">
        <label>Judul Produk</label>
        <input type="text" id="prod-title" class="form-control" placeholder="Contoh: Kemeja Oversize Pria">
      </div>
      <div class="form-group">
        <label>Link Shopee Affiliate</label>
        <input type="url" id="prod-link" class="form-control" placeholder="https://s.shopee.co.id/xxx">
      </div>
      <div class="form-group">
        <label>URL Gambar Produk</label>
        <input type="url" id="prod-img" class="form-control" placeholder="https://images.shopee.co.id/xxx">
      </div>
      <div class="form-group">
        <label>Kategori</label>
        <input type="text" id="prod-cat" class="form-control" placeholder="Contoh: Fashion, Elektronik, Rumah Tangga">
      </div>
      
      <button class="btn-submit" onclick="saveProduct()">Simpan Produk</button>
      <button onclick="closeModal('product-modal')" style="width:100%; border:none; background:none; padding:10px; margin-top:6px; cursor:pointer; font-size:0.8rem; color:#64748b;">Batal</button>
    </div>
  </div>

  <script>
    // DATA INITIAL STORAGE (Lokal pada Perangkat Anda)
    const DEFAULT_PRODUCTS = [
      {
        id: 1,
        title: "Sepatu Sneaker Kasual Trendy Shopee",
        link: "https://s.shopee.co.id/example1",
        image: "https://via.placeholder.com/150/ee4d2d/ffffff?text=Sepatu",
        category: "Fashion"
      },
      {
        id: 2,
        title: "Holder HP Portable Desk Stand Aluminum",
        link: "https://s.shopee.co.id/example2",
        image: "https://via.placeholder.com/150/0284c7/ffffff?text=Gadget",
        category: "Elektronik"
      }
    ];

    let products = JSON.parse(localStorage.getItem('kk_products')) || DEFAULT_PRODUCTS;
    let selectedCategory = 'Semua';
    let isAdmin = localStorage.getItem('kk_is_admin') === 'true';

    // INITIALIZATION
    document.addEventListener("DOMContentLoaded", () => {
      if (isAdmin) document.body.classList.add('admin-mode');
      renderApp();
    });

    function saveToStorage() {
      localStorage.setItem('kk_products', JSON.stringify(products));
      renderApp();
    }

    // RENDER FUNCTIONS
    function renderApp() {
      renderCategories();
      renderProducts();
    }

    function getCategories() {
      const cats = ['Semua', ...new Set(products.map(p => p.category || 'Lainnya'))];
      return cats;
    }

    function renderCategories() {
      const categories = getCategories();
      const chipContainer = document.getElementById('category-chips');
      const drawerContainer = document.getElementById('drawer-categories');

      // Chip Render
      chipContainer.innerHTML = categories.map(cat => `
        <button class="chip ${cat === selectedCategory ? 'active' : ''}" onclick="selectCategory('${cat}')">${cat}</button>
      `).join('');

      // Drawer Render
      drawerContainer.innerHTML = categories.map(cat => `
        <li class="category-item ${cat === selectedCategory ? 'active' : ''}" onclick="selectCategory('${cat}'); toggleDrawer();">
          <span>${cat}</span>
          <i class="fa-solid fa-chevron-right" style="font-size: 0.75rem;"></i>
        </li>
      `).join('');
    }

    function selectCategory(cat) {
      selectedCategory = cat;
      renderApp();
    }

    function renderProducts() {
      const container = document.getElementById('product-container');
      const filtered = selectedCategory === 'Semua' 
        ? products 
        : products.filter(p => p.category === selectedCategory);

      if (filtered.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:40px; color:#94a3b8;">Belum ada produk di kategori ini.</div>`;
        return;
      }

      container.innerHTML = filtered.map((item, index) => {
        const realIndex = products.findIndex(p => p.id === item.id);
        return `
          <div class="product-card">
            <img src="${item.image}" class="product-img" alt="${item.title}" onerror="this.src='https://via.placeholder.com/150?text=No+Image'">
            <div class="product-details">
              <span class="product-tag">${item.category}</span>
              <div class="product-title">${item.title}</div>
            </div>

            <!-- Normal Button (Shopee Redirect) -->
            <a href="${item.link}" target="_blank" class="btn-buy">
              Beli <i class="fa-solid fa-arrow-up-right-from-square"></i>
            </a>

            <!-- Admin Controls (Reorder / Edit / Delete) -->
            <div class="admin-controls">
              <button class="btn-admin-action" onclick="moveProduct(${realIndex}, -1)" title="Naikkan"><i class="fa-solid fa-arrow-up"></i></button>
              <button class="btn-admin-action" onclick="moveProduct(${realIndex}, 1)" title="Turunkan"><i class="fa-solid fa-arrow-down"></i></button>
              <button class="btn-admin-action edit" onclick="openEditModal(${realIndex})"><i class="fa-solid fa-pen"></i></button>
              <button class="btn-admin-action delete" onclick="deleteProduct(${realIndex})"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
        `;
      }).join('');
    }

    // ADMIN CRUD ACTIONS
    function moveProduct(index, direction) {
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= products.length) return;
      const temp = products[index];
      products[index] = products[targetIndex];
      products[targetIndex] = temp;
      saveToStorage();
    }

    function deleteProduct(index) {
      if (confirm("Apakah Anda yakin ingin menghapus produk ini?")) {
        products.splice(index, 1);
        saveToStorage();
      }
    }

    function openAddModal() {
      document.getElementById('modal-title').innerText = "Tambah Produk Baru";
      document.getElementById('edit-index').value = "-1";
      document.getElementById('prod-title').value = "";
      document.getElementById('prod-link').value = "";
      document.getElementById('prod-img').value = "";
      document.getElementById('prod-cat').value = "";
      document.getElementById('product-modal').classList.add('open');
    }

    function openEditModal(index) {
      const p = products[index];
      document.getElementById('modal-title').innerText = "Edit Produk";
      document.getElementById('edit-index').value = index;
      document.getElementById('prod-title').value = p.title;
      document.getElementById('prod-link').value = p.link;
      document.getElementById('prod-img').value = p.image;
      document.getElementById('prod-cat').value = p.category;
      document.getElementById('product-modal').classList.add('open');
    }

    function saveProduct() {
      const index = parseInt(document.getElementById('edit-index').value);
      const title = document.getElementById('prod-title').value.trim();
      const link = document.getElementById('prod-link').value.trim();
      const image = document.getElementById('prod-img').value.trim();
      const category = document.getElementById('prod-cat').value.trim() || 'Lainnya';

      if (!title || !link) {
        alert("Judul dan Link Shopee Wajib diisi!");
        return;
      }

      const productData = {
        id: index === -1 ? Date.now() : products[index].id,
        title, link, image, category
      };

      if (index === -1) {
        products.unshift(productData);
      } else {
        products[index] = productData;
      }

      saveToStorage();
      closeModal('product-modal');
    }

    // MODAL & DRAWER CONTROLLER
    function toggleDrawer() {
      document.getElementById('drawer').classList.toggle('open');
      document.getElementById('drawer-overlay').classList.toggle('open');
    }

    function openLoginModal() {
      document.getElementById('login-modal').classList.add('open');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('open');
    }

    function verifyLogin() {
      const pass = document.getElementById('admin-pass-input').value;
      if (pass === "123456") { // Ganti password admin di sini sesuai keinginan
        isAdmin = true;
        localStorage.setItem('kk_is_admin', 'true');
        document.body.classList.add('admin-mode');
        closeModal('login-modal');
        renderApp();
      } else {
        alert("Password Admin Salah!");
      }
    }

    function logoutAdmin() {
      isAdmin = false;
      localStorage.removeItem('kk_is_admin');
      document.body.classList.remove('admin-mode');
      renderApp();
    }
  </script>
</body>
</html>
